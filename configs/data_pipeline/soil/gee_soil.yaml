name: soil
log_level: INFO

# All 7 SoilGrids variables the gee_soilgrids.SOIL_ASSETS map supports.
# nitrogen/phh2o aren't used by the van Genuchten hydraulic derivation
# (calculate_van_genuchten) but are kept available as potential extra
# static features.
variables:
  - clay
  - nitrogen
  - phh2o
  - soc
  - bdod
  - sand
  - silt

# Full SoilGrids depth grid (matches default_zs() in
# src/data_pipeline/soil/utils_soil/default_soil_variables.py), one
# SoilLayers entry per depth in the assembled multi-layer soil YAML. Going
# past 30cm matters: wheat/maize root zones extend well beyond it.
depth_layers:
  - 0-5cm
  - 5-15cm
  - 15-30cm
  - 30-60cm
  - 60-100cm
  - 100-200cm
