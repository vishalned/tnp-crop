# @package source
# Half crop, half prior batches whose shapes come from the crop sampler (fresh draws, seed + 10000).
prior_fraction: 0.5     # share of steps with prior tables (0 = crop only, 1 = prior only)
prior_shapes: matched       # random | matched (the crop sampler's shapes)
shape_seed_offset: 10000
prior_max_rows: 1024
prior_max_features: 100
num_workers: 14          # DataLoader workers (the prior is CPU-bound)
