# @package source
# TabICLv2 prior tables with random shapes only (from scratch).
prior_fraction: 1.0     # share of steps with prior tables (0 = crop only, 1 = prior only)
prior_shapes: random       # random | matched (the crop sampler's shapes)
shape_seed_offset: 0
prior_max_rows: 1024
prior_max_features: 100
num_workers: 4          # DataLoader workers (the prior is CPU-bound)
