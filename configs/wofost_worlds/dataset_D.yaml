# Dataset D: C + irrigation: a world is potential production (PP, irrigated) with probability = its
# region's irrigated maize share, else water-limited. PLACEHOLDER: no MIRCA2000 data yet, so every region
# gets default_irrigated_share (0.5 = half irrigated, half rain-fed); set irrigation_share_csv (region_id,irrigated_share) once available.
name: D
crop: maize
locations_csv: data/raw/locations/locations_maize.csv
output_dir: /projects/prjs1788/tnp-crop/wofost_worlds/D
start_year: 2005
end_year: 2020
seed: 42
max_locations: 1585
sowing_scheme: world
worlds_per_location: 10
world_shift_days: 10
year_jitter_days: 3
default_cultivar: Grain_maize_201
sample_cultivar: true
cultivars: [Grain_maize_201, Grain_maize_202, Grain_maize_203, Grain_maize_204, Grain_maize_205]
sample_factors: true
factor_ranges:              # multiplicative factor, uniform in [low, high]; tables: value column only
  TSUM1: [0.9, 1.1]
  TSUM2: [0.9, 1.1]
  AMAX_REF: [0.85, 1.15]    # WOFOST 8.1 maize has AMAX_REF, not AMAXTB
  EFFTB: [0.85, 1.15]
  SPAN: [0.85, 1.15]
  SLATB: [0.85, 1.15]
  RDMCR: [0.85, 1.15]       # rounded to rdmcr_step_cm, <= soil depth (200 cm)
rdmcr_step_cm: 5
irrigation: true
irrigation_share_csv: null       # CSV: region_id,irrigated_share (e.g. MIRCA2000 per country)
irrigation_region_column: country
default_irrigated_share: 0.5     # placeholder: half the worlds irrigated (PP), half rain-fed, every region
