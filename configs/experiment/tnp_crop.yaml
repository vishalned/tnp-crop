# @package _global_

# TNP-D on WOFOST-simulated crop seasons (see src/data/crop_datamodule.py)
# python src/train.py experiment=tnp_crop

defaults:
  - override /data: crop
  - override /model: tnp_crop
  - override /callbacks: default
  - override /trainer: gpu

tags: ["tnp", "crop", "wofost"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 100
  gradient_clip_val: 1.0

logger:
  wandb:
    tags: ${tags}
    group: "tnp_crop"
  aim:
    experiment: "tnp_crop"
