# @package _global_

# smoke-test the TNP-D architecture on synthetic weather-like episodes,
# ahead of the real WOFOST-simulated episode dataset
# to execute this experiment run:
# python src/train.py experiment=tnp_synthetic

defaults:
  - override /data: tnp
  - override /model: tnp
  - override /callbacks: default
  - override /trainer: default

tags: ["tnp", "synthetic", "smoke-test"]

seed: 12345

trainer:
  min_epochs: 5
  max_epochs: 5

model:
  optimizer:
    lr: 0.0003

data:
  batch_size: 16

logger:
  wandb:
    tags: ${tags}
    group: "tnp"
  aim:
    experiment: "tnp"
