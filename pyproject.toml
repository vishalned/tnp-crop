[project]
name = "tnp-crop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2",
  "hydra-colorlog>=1.2.0",
  "rootutils",
  "rich",
  "python-dotenv",
  "requests>=2.34.2",
  "pandas>=2.3.3",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "lightning>=2.2",
  "torchmetrics>=1.3",
]
data = [
    "requests>=2.34.2",
    "pcse>=6.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "earthengine-api>=1.0",
    "zarr>=3.1; python_version >= '3.11'",
    "matplotlib>=3.8",
    "pyarrow>=15",  # processed tables are written as parquet
]
nanotabicl = [
  # torch comes with the `train` extra
  "scikit-learn>=1.3",  # the prior's ExtraTrees filter
  "huggingface_hub>=0.23",  # downloading the official TabICLv2 checkpoint
  "pyarrow>=15",  # parquet tables
  "pandas>=2.3.3",
]
dev = [
  "pytest",
  "pre-commit",
]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
