[project]
name = "tnp-crop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2",
  "hydra-colorlog>=1.2.0",
  "rootutils",
  "rich",
  "python-dotenv",
  "requests>=2.34.2",
  "pandas>=2.3.3",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "lightning>=2.2",
  "torchmetrics>=1.3",
]
data = [
    "requests>=2.34.2",
    "pcse>=6.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "earthengine-api>=1.0",
    "zarr>=3.1; python_version >= '3.11'",
    "matplotlib>=3.8",
]
tabicl = [
  # `tabicl[finetune]` itself leaves transformers/wandb unpinned, which makes
  # the resolver backtrack to an ancient transformers that needs a Rust
  # compiler to build tokenizers from source -- pin a sane floor instead.
  "tabicl>=2.2.0",
  "transformers>=4.40",
  "wandb>=0.17",
  "lightning-utilities>=0.10", # for src.utils' RankedLogger/extras, without pulling in full `lightning`
]
dev = [
  "pytest",
  "pre-commit",
]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
